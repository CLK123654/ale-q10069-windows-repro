name: windows-2025

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Run independent verification
        shell: pwsh
        run: node verification/verify.mjs

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q10069-windows-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
